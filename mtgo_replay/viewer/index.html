<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGO Replay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">MTGO Replay</div>
  <label class="field">
    <span>Match</span>
    <select id="matchSel"></select>
  </label>
  <nav id="gameTabs" class="tabs" aria-label="Games"></nav>
  <div id="gameInfo" class="game-info"></div>
</header>

<main class="layout">
  <section class="table" id="table">
    <div class="player" id="pTop"></div>
    <div class="midline">
      <div class="action" id="action"></div>
      <div class="stack" id="stack"></div>
    </div>
    <div class="player me" id="pBottom"></div>
  </section>

  <aside class="log" aria-label="Game log">
    <div class="log-head">Log <span id="logCount"></span></div>
    <ol id="log"></ol>
  </aside>
</main>

<footer class="controls">
  <div class="buttons">
    <button id="btnFirst" title="First action (Home)">⏮</button>
    <button id="btnPrevTurn" title="Previous turn (↑)">⇤</button>
    <button id="btnPrev" title="Previous action (←)">◀</button>
    <button id="btnNext" title="Next action (→)">▶</button>
    <button id="btnNextTurn" title="Next turn (↓)">⇥</button>
    <button id="btnLast" title="Last action (End)">⏭</button>
  </div>
  <div class="timeline">
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Timeline">
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="position" id="position"></div>
</footer>

<div class="preview" id="preview" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle"></span><button id="modalClose" title="Close (Esc)">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="empty" id="empty" hidden>
  <h2>No reviews found</h2>
  <p>Generate them first with <code>py -m mtgo_replay</code>, then reload this page.</p>
</div>

<script src="app.js"></script>
</body>
</html>
